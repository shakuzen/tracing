name: 'Create Release Bundle'
description: 'Creates a JFrog Release Bundle for the specified version'
inputs:
  version:
    description: 'The version to release (e.g., 1.2.3)'
    required: true
  artifactory-username:
    description: 'Commercial Artifactory Username'
    required: true
  artifactory-password:
    description: 'Commercial Artifactory Password'
    required: true
runs:
  using: "composite"
  steps:
    - name: Trigger JFrog Release Bundle
      env:
        COMMERCIAL_ARTIFACTORY_USERNAME: ${{ inputs.artifactory-username }}
        COMMERCIAL_ARTIFACTORY_PASSWORD: ${{ inputs.artifactory-password }}
        VERSION: ${{ inputs.version }}
      run: |
        curl -sS -u "${COMMERCIAL_ARTIFACTORY_USERNAME}:${COMMERCIAL_ARTIFACTORY_PASSWORD}" \
          -X POST \
          -H 'X-JFrog-Signing-Key-Name: packagesKey' \
          -H 'Content-Type: application/json' \
          'https://usw1.packages.broadcom.com/lifecycle/api/v2/release_bundle?project=spring&async=false' \
          --data '{"release_bundle_name": "TNZ-micrometer-tracing-commercial", "release_bundle_version": "'"${VERSION}"'", "source_type": "aql", "source": {"aql": "items.find({\"repo\":{\"$eq\":\"spring-enterprise-maven-prod-local\"}, \"path\": {\"$match\":\"io/micrometer/*/'"${VERSION}"'\"}}).sort({\"$asc\": [\"path\",\"name\"]})"}}'
      shell: bash
