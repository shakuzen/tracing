name: Deploy
description: Deploy the build artifacts
inputs:
  java-version:
    description: The Java version to use for the deployment
    required: true
  develocity-access-key:
    description: The key to authenticate with Develocity (Gradle Enterprise)
    required: true
  repository-username:
    description: The username for the repo to publish publications
    required: true
  repository-password:
    description: The password for the repo to publish publications
    required: true
  signing-keyid:
    description: The key ID to sign publications
    required: true
  signing-key:
    description: The key to sign publications
    required: true
  signing-passphrase:
    description: The passphrase of the key to sign publications
    required: true
runs:
  using: composite
  steps:
    - name: Setup Build
      uses: ./.github/actions/setup-build
      with:
        java-version: ${{ inputs.java-version }}
        develocity-access-key: ${{ inputs.develocity-access-key }}
    - name: Deploy
      shell: bash
      env:
        GHA_REF_TYPE: ${{ github.ref_type }}
        GHA_REF_NAME: ${{ github.ref_name }}
        GHA_REF: ${{ github.ref }}
        GHA_COMMIT: ${{ github.sha }}
        GHA_STAGE: deploy
        ORG_GRADLE_PROJECT_REPOSITORY_USERNAME: ${{ inputs.repository-username }}
        ORG_GRADLE_PROJECT_REPOSITORY_PASSWORD: ${{ inputs.repository-password }}
        ORG_GRADLE_PROJECT_SIGNING_KEYID: ${{ inputs.signing-keyid }}
        ORG_GRADLE_PROJECT_SIGNING_KEY: ${{ inputs.signing-key }}
        ORG_GRADLE_PROJECT_SIGNING_PASSWORD: ${{ inputs.signing-passphrase }}
      run: ./gradle/deploy.sh
