version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "1.1.x" # oldest supported branch
    schedule:
      interval: "monthly"
# Non-build dependencies; target every supported branch
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    target-branch: "1.1.x"
    milestone: 5
    ignore:
      # only upgrade patch versions
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 30
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    target-branch: "1.2.x"
    milestone: 11
    ignore:
      # only upgrade patch versions
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 30
