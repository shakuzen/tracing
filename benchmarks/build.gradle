configurations {
    jmhLegacy {
        extendsFrom jmh
    }
}

dependencies {
    jmh project(':micrometer-tracing-bridge-brave')
    jmh project(':micrometer-tracing-bridge-otel')
    jmh libs.jmh
    jmh 'io.zipkin.brave:brave-tests'

    jmh libs.logback

    // Nebula doesn't like having jmhAnnotationProcessor without jmh so we just add it twice.
    jmh libs.jmhGeneratorAnnProcess
    jmhAnnotationProcessor libs.jmhGeneratorAnnProcess
}

configurations.jmhLegacy.resolutionStrategy.dependencySubstitution {
    substitute project(':micrometer-tracing-bridge-brave') \
        using module('io.micrometer:micrometer-tracing-bridge-brave:1.4.15')
}

jmh {
    jmhVersion = '1.37'
    fork = 2
    warmupIterations = 3
    iterations = 5
    duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true
    if (project.hasProperty('jmhInclude')) {
        includes = [project.property('jmhInclude')]
    }
    profilers = ['gc']
}

tasks.register('jmhLegacy', me.champeau.jmh.JMHTask) {
    description = 'Runs JMH benchmarks against published Micrometer Tracing 1.4.15'
    group = 'jmh'
    dependsOn tasks.jmhJar
    jarArchive.set(tasks.jmhJar.archiveFile)
    jmhClasspath.setFrom(configurations.jmhLegacy, tasks.jmhJar.archiveFile)
    profilers = ['gc']
    resultsFile.set(file("${layout.buildDirectory.get()}/results/jmh/results-1.4.15.txt"))
}

tasks.register('jmhCompare') {
    description = 'Runs JMH benchmarks for both current PR code and 1.4.15'
    group = 'jmh'
    dependsOn tasks.jmh, tasks.jmhLegacy
}
